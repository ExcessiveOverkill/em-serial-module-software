
hardware:
  type: 1 #32 bit
  version: 0  #32 bit
  readable_name: "Estop board"
  description: "Estop board"

firmware:
  version: 0
  release_date: "7/18/2024"
  description: "Estop board"


message_severities:
  none: 0
  info: 1
  warning: 2
  error: 3
  critical: 4

messages:
  communication:
    timeout_warning:
      readable_name: "Timeout"
      description: "No valid packets received within the timeout period"
      severity: "warning"

    timeout_error:
      readable_name: "Timeout error"
      description: "No valid packets received within the timeout period, and the current state cannot run without communication"
      severity: "error"

    invalid_address:
      readable_name: "Invalid address"
      description: "read/write attempted on an address that either doesn't exist, or has incompatible permissions"
      severity: "warning"

    invalid_cyclic_config:
      readable_name: "Invalic cyclic config"
      description: "Attempted to configure a cyclic value that either doesn't exist, or has incompatible permissions"
      severity: "warning"

  checks:
    brake_1_powered_when_off:
      readable_name: "Brake 1 powered when off"
      description: "Brake 1 is powered when it should be off"
      time_delay_us: 50e3
      severity: "critical"

    brake_2_powered_when_off:
      readable_name: "Brake 2 powered when off"
      description: "Brake 2 is powered when it should be off"
      time_delay_us: 50e3
      severity: "critical"

    brake_3_powered_when_off:
      readable_name: "Brake 3 powered when off"
      description: "Brake 3 is powered when it should be off"
      time_delay_us: 50e3
      severity: "critical"

    brake_4_powered_when_off:
      readable_name: "Brake 4 powered when off"
      description: "Brake 4 is powered when it should be off"
      time_delay_us: 50e3
      severity: "critical"

    brake_5_powered_when_off:
      readable_name: "Brake 5 powered when off"
      description: "Brake 5 is powered when it should be off"
      time_delay_us: 50e3
      severity: "critical"

    brake_6_powered_when_off:
      readable_name: "Brake 6 powered when off"
      description: "Brake 6 is powered when it should be off"
