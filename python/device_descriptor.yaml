  system:
    control_deadline_missed:
      readable_name: "Control deadline missed"
      description: "Control loop did not run in time"
      severity: "critical"

    invalid_state:
      readable_name: "Invalid state"
      description: "Invalid state selected"
      severity: "error"

    watchdog_timeout:
      readable_name: "Watchdog timeout"
      description: "Hardware watchdog triggered the device to reset, this usually indicates a firmware bug or hardware fault"
      severity: "critical"


hard_parameters: 
  
  # TODO reword
  # DO NOT MODIFY THESE VALUES UNLESS YOU KNOW WHAT YOU ARE DOING
  # incorrect values may result in catastrophic hardware failure
  # these are set at build time and cannot be modified by the controller


  MESSAGE:
    value: 0b0001 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Normal message"

  WARNING:
    value: 0b0010 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Warning message"

  ERROR:
    value: 0b0100 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Error message"

  CRITICAL:
    value: 0b1000 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Critical error message"

  sysclk:
    value: 100
    var_type: "uint32_t"
    unit: "Mhz"
    readable_name: "System clock frequency"
    description: "System clock frequency"

  vcxo_pwm_clk:
    value: 2
    var_type: "uint16_t"
    unit: "khz"
    readable_name: "VCXO PWM clock frequency"
    description: "VCXO PWM clock frequency"

  update_frequency: # must be above 1khz to update the watchdog
    value: 5000
    var_type: "uint16_t"
    unit: "Hz"
    readable_name: "Main system update frequency"
    description: "Main system update frequency"

  systick_frequency:
    value: 100
    var_type: "uint32_t"
    unit: "Hz"
    readable_name: "System tick frequency"
    description: "System tick frequency, do not set above 1khz"

  brake_minimum_off_time:
    value: 1000
    var_type: "uint16_t"
    unit: "milliseconds"
    readable_name: "Brake minimum off time"
    description: "Minimum time to wait before turning on the brake again after it has been turned off, used to prevent rapid cycling of the brake relay"
  
  contactor_minimum_off_time:
    value: 4000
    var_type: "uint16_t"
    unit: "milliseconds"
    readable_name: "Contactor minimum off time"
    description: "Minimum time to wait before turning on the contactor again after it has been turned off, used to prevent rapid cycling of the contactor relay"

  precharge_overlap_time:
    value: 500
    var_type: "uint16_t"
    unit: "milliseconds"
    readable_name: "Precharge overlap time"
    description: "Time to wait before turning off the precharge contactor after the main contactor is turned on"

  max_fan_speed_rpm:
    value: 4200
    var_type: "uint16_t"
    unit: "rpm"
    readable_name: "Max fan speed"
    description: "Maximum fan speed"

  device_starting_address:
    value: 0
    var_type: "uint8_t"
    unit: "address"
    readable_name: "Device starting address"
    description: "rs422 address to start at, DIP switches may be used to increment it, read at power on"

  cyclic_address_count:
    value: 32
    var_type: "uint8_t"
    unit: "count"
    readable_name: "Cyclic address count"
    description: "Maximum number of cyclic addresses that can be configured"
  


registers:
# values meant to be read/written by the controller to configure and use the device

  communication_update_interval:
    value: 100000
    var_type: "uint32_t"
    unit: "10ns"
    readable_name: "Communication update interval"
    description: "How often the controller sends a packet to the device, this is used for clock synchronization. note that is must be an even multiple of main PWM frequency"
    permissions: "read/write"

  pwm_timer_phase_offset:
    value: 0
    var_type: "uint32_t"
    unit: "counts"
    readable_name: "PWM timer phase offset"
    description: "How many counts to delay the start of the main phase PWM timer when synchronizing with the controller"
    permissions: "read/write"

  enable_controller_syncronization:
    value: 1
    var_type: "uint8_t"
    unit: ""
    readable_name: "Enable controller synchronization"
    description: "Enable or disable the controller synchronization feature, this is used to synchronize the device clock with the controller"
    permissions: "read/write"

  controller_syncronization_valid:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Controller synchronization is ok"
    description: "Indicates if the device is synchronized with the controller"
    permissions: "read"

  requested_state:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Requested state"
    description: "FAULT_RESET: 3"
    permissions: "read/write"

  STO_only:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "STO only"
    description: "Set to 1 to enable the STO only mode, this will allow main power to stay on and only use STO to disable power"
    permissions: "read/write"

  enable_power:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Enable main power"
    description: "Set to 1 to start power up sequence, 0 to disable power"
    permissions: "read/write"

  enable_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Enable main power required inputs"
    description: "which aux inputs are required to enable startup (bitwise selection)"
    permissions: "read/write"

  dms_ok:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "DMS is ok"
    description: "Deadman switch is enabled (movement allowed)"
    permissions: "read"

  estop_chain_ok:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "E-stop chain ok"
    description: "E-stop chain is ok (movement allowed)"
    permissions: "read"

  precharge_active:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Precharge active"
    description: "Indicates if the precharge contactor is active (precharging)"
    permissions: "read"

  main_power_active:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Main power active"
    description: "Indicates if the main power contactor is active (main power on)"
    permissions: "read"

  brake_status:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Brake status"
    description: "Indicates if the brakes are active, bitwise (brakes released)"
    permissions: "read"

  enable_brakes:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Enable brakes"
    description: "bit 0: brake 1, bit 1: brake 2, bit 2: brake 3, bit 3: brake 4, bit 4: brake 5, bit 5: brake 6"
    permissions: "read/write"

  brake_1_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Brake 1 required inputs"
    description: "which aux inputs are required to release the brake (bitwise selection)"
    permissions: "read/write"

  brake_2_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Brake 2 required inputs"
    description: "which aux inputs are required to release the brake (bitwise selection)"
    permissions: "read/write"

  brake_3_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Brake 3 required inputs"
    description: "which aux inputs are required to release the brake (bitwise selection)"
    permissions: "read/write"

  brake_4_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Brake 4 required inputs"
    description: "which aux inputs are required to release the brake (bitwise selection)"
    permissions: "read/write"

  brake_5_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Brake 5 required inputs"
    description: "which aux inputs are required to release the brake (bitwise selection)"
    permissions: "read/write"

  brake_6_required_inputs:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: ""
    readable_name: "Brake 6 required inputs"
    description: "which aux inputs are required to release the brake (bitwise selection)"
    permissions: "read/write"

  precharge_done:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Precharge done"
    description: "Indicates we can switch to the main contactor"
    permissions: "write"

  precharge_delay_min:
    value: 1500
    var_type: "uint16_t"
    unit: "milliseconds"
    readable_name: "Precharge delay"
    description: "How long to wait before allowing the main contactor to enable after precharge is started"
    permissions: "read/write"

  precharge_delay_max:
    value: 4000
    var_type: "uint16_t"
    unit: "milliseconds"
    readable_name: "Precharge delay"
    description: "How long to allow the precharge contactor to be one without switching to the main contactor (triggers a fault if it is too long)"
    permissions: "read/write"

  precharge_contactor_external_feedback_polarity:
    value: 1
    var_type: "uint8_t"
    unit: ""
    readable_name: "Precharge contactor external feedback polarity"
    description: "Set to 1 if the precharge contactor feedback is inverted (active low), 0 if it is not inverted (active high)"
    permissions: "read/write"

  main_contactor_external_feedback_polarity:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Main contactor external feedback polarity"
    description: "Set to 1 if the main contactor feedback is inverted (active low), 0 if it is not inverted (active high)"
    permissions: "read/write"

  isolation_contactor_external_feedback_polarity:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Isolation contactor external feedback polarity"
    description: "Set to 1 if the isolation contactor feedback is inverted (active low), 0 if it is not inverted (active high)"
    permissions: "read/write"

  fan_cmd_speed:
    value: 0
    var_type: "uint16_t"
    unit: ""
    readable_name: "Fan command speed"
    description: "Commanded fan speed, 0 to disable the fan"
    permissions: "read/write"

  fan_fbk_speed:
    value: 0
    var_type: "uint16_t"
    unit: ""
    readable_name: "Fan feedback speed"
    description: "Actual fan speed scaled to 16bit, read only"
    permissions: "read"

  status:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Status"
    description: "Current status of the device, bitwise (bit 0: fault, bit 1: idle, bit 2: ready)"
    permissions: "read"

  

