    var_type: "uint32_t"
    unit: "address"
    readable_name: "Firmware update data address and control"
    description: "Base address for firmware update data, and control register, write to 0xFFFFFFFF to start the firmware update process(MUST HAVE A VALID FIRMWARE IMAGE ALREADY IN FLASH)"
    permissions: "read/write"

