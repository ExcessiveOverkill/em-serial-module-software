
hardware:
  type: 2 #32 bit
  version: 0  #32 bit
  readable_name: "6d mouse"
  description: "S6d mouse for user input"

firmware:
  version: 0
  release_date: "7/18/2024"
  description: "Firmware for (model number goes here) rev (hardware rev number goes here)"


message_severities:
  none: 0
  info: 1
  warning: 2
  error: 3
  critical: 4

messages:
  communication:
    timeout_warning:
      readable_name: "Timeout"
      description: "No valid packets received within the timeout period"
      severity: "warning"

    timeout_error:
      readable_name: "Timeout error"
      description: "No valid packets received within the timeout period, and the current state cannot run without communication"
      severity: "error"

    invalid_address:
      readable_name: "Invalid address"
      description: "read/write attempted on an address that either doesn't exist, or has incompatible permissions"
      severity: "warning"

    invalid_cyclic_config:
      readable_name: "Invalic cyclic config"
      description: "Attempted to configure a cyclic value that either doesn't exist, or has incompatible permissions"
      severity: "warning"

  system:
    control_deadline_missed:
      readable_name: "Control deadline missed"
      description: "Control loop did not run in time"
      severity: "critical"

    invalid_state:
      readable_name: "Invalid state"
      description: "Invalid state selected"
      severity: "error"

    watchdog_timeout:
      readable_name: "Watchdog timeout"
      description: "Hardware watchdog triggered the device to reset, this usually indicates a firmware bug or hardware fault"
      severity: "critical"


hard_parameters: 
  
  # TODO reword
  # DO NOT MODIFY THESE VALUES UNLESS YOU KNOW WHAT YOU ARE DOING
  # incorrect values may result in catastrophic hardware failure
  # these are set at build time and cannot be modified by the controller


  MESSAGE:
    value: 0b0001 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Normal message"

  WARNING:
    value: 0b0010 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Warning message"

  ERROR:
    value: 0b0100 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Error message"

  CRITICAL:
    value: 0b1000 << 28
    var_type: "uint32_t"
    unit: ""
    readable_name: ""
    description: "Critical error message"

  sysclk:
    value: 100
    var_type: "uint32_t"
    unit: "Mhz"
    readable_name: "System clock frequency"
    description: "System clock frequency"

  vcxo_pwm_clk:
    value: 2
    var_type: "uint16_t"
    unit: "khz"
    readable_name: "VCXO PWM clock frequency"
    description: "VCXO PWM clock frequency"

  update_frequency: # must be above 1khz to update the watchdog
    value: 5000
    var_type: "uint16_t"
    unit: "Hz"
    readable_name: "Main system update frequency"
    description: "Main system update frequency"

  systick_frequency:
    value: 100
    var_type: "uint32_t"
    unit: "Hz"
    readable_name: "System tick frequency"
    description: "System tick frequency, do not set above 1khz"

  device_starting_address:
    value: 0
    var_type: "uint8_t"
    unit: "address"
    readable_name: "Device starting address"
    description: "rs422 address to start at, DIP switches may be used to increment it, read at power on"

  cyclic_address_count:
    value: 32
    var_type: "uint8_t"
    unit: "count"
    readable_name: "Cyclic address count"
    description: "Maximum number of cyclic addresses that can be configured"
  


registers:
# values meant to be read/written by the controller to configure and use the device

  communication_update_interval:
    value: 200000
    var_type: "uint32_t"
    unit: "10ns"
    readable_name: "Communication update interval"
    description: "How often the controller sends a packet to the device, this is used for clock synchronization. note that is must be an even multiple of main PWM frequency"
    permissions: "read/write"

  pwm_timer_phase_offset:
    value: 0
    var_type: "uint32_t"
    unit: "counts"
    readable_name: "PWM timer phase offset"
    description: "How many counts to delay the start of the main phase PWM timer when synchronizing with the controller"
    permissions: "read/write"

  enable_controller_syncronization:
    value: 1
    var_type: "uint8_t"
    unit: ""
    readable_name: "Enable controller synchronization"
    description: "Enable or disable the controller synchronization feature, this is used to synchronize the device clock with the controller"
    permissions: "read/write"

  controller_syncronization_valid:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Controller synchronization is ok"
    description: "Indicates if the device is synchronized with the controller"
    permissions: "read"

  requested_state:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Requested state"
    description: "FAULT_RESET: 3"
    permissions: "read/write"


  axis_0_position:
    value: 0
    var_type: "int32_t"
    unit: "counts"
    readable_name: "Axis 0 position"
    description: "Current position of axis 0 in counts"
    permissions: "read"

  axis_1_position:
    value: 0
    var_type: "int32_t"
    unit: "counts"
    readable_name: "Axis 1 position"
    description: "Current position of axis 1 in counts"
    permissions: "read"

  axis_2_position:
    value: 0
    var_type: "int32_t"
    unit: "counts"
    readable_name: "Axis 2 position"
    description: "Current position of axis 2 in counts"
    permissions: "read"

  axis_3_position:
    value: 0
    var_type: "int32_t"
    unit: "counts"
    readable_name: "Axis 3 position"
    description: "Current position of axis 3 in counts"
    permissions: "read"

  axis_4_position:
    value: 0
    var_type: "int32_t"
    unit: "counts"
    readable_name: "Axis 4 position"
    description: "Current position of axis 4 in counts"
    permissions: "read"

  axis_5_position:
    value: 0
    var_type: "int32_t"
    unit: "counts"
    readable_name: "Axis 5 position"
    description: "Current position of axis 5 in counts"
    permissions: "read"

  button_0_state:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Button 0 state"
    description: "Current state of button 0, 1 = pressed, 0 = not pressed"
    permissions: "read"


  ####################### COMMUNICATION REGISTERS #######################

  dummy_register:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Dummy register"
    description: "Dummy register for pointing cyclic regs to when not in use"
    permissions: "read/write"

  message_control:
    value: 0
    var_type: "uint16_t"
    unit: ""
    readable_name: "Message control"
    description: "Selects the message to read back"
    permissions: "read/write"

  message_time_lower:
    value: 0
    var_type: "uint32_t"
    unit: "microseconds"
    readable_name: "Message time upper 32 bits"
    description: "last time that the selected message was triggered"
    permissions: "read"

  message_time_upper:
    value: 0
    var_type: "uint32_t"
    unit: "microseconds"
    readable_name: "Message time lower 32 bits"
    description: "last time that the selected message was triggered"
    permissions: "read"

  device_communication_watchdog_timeout:
    value: 1
    var_type: "uint16_t"
    unit: "milliseconds"
    readable_name: "Device communication watchdog timeout"
    description: "How long before a timeout occurs due to no valid packet transfers"
    permissions: "read/write"

  enable_cyclic_data:
    value: 0
    var_type: "uint8_t"
    unit: ""
    readable_name: "Enable cyclic data"
    description: "Enable sending/receiving configured cyclic data"
    permissions: "read/write"

  cyclic_read_address_n:
    value: 0xFFFF
    var_type: "uint16_t"
    unit: "address"
    readable_name: "Cyclic read address"
    description: "Set to a register address to enable continuous cyclic reading"
    permissions: "read/write"

  cyclic_write_address_n:
